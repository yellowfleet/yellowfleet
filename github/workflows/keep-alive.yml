name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every Tuesday and Friday (Every 3-4 days)
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Allows you to run this manually from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Execute Keep-Alive Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node supabase-keep-alive.js
